name: Release Desktop Artifact

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  desktop-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install
        run: npm ci

      - name: Build Desktop Release
        run: npm run desktop:build

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: glassbridge-desktop
          path: |
            staging/desktop/glassbridge_desktop.exe
            staging/desktop/glassbridge_desktop.pdb
            staging/desktop/glassbridge_desktop.exe.buildinfo.json
