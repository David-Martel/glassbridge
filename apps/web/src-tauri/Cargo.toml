[package]
name = "glassbridge_desktop"
version = "0.1.0"
edition = "2021"
description = "Desktop shell for GlassBridge"
license = "MIT"
publish = false

# Expose a lib target so `cargo test` can reach logic in lib.rs / adb_mock.rs
# without launching the Tauri application.
[lib]
name = "glassbridge_desktop"
path = "src/lib.rs"

[[bin]]
name = "glassbridge_desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri framework
tauri = { version = "2", features = [] }

# HTTP server (embedded Axum replaces Node.js Fastify backend)
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLite registry (replaces node:sqlite DatabaseSync)
rusqlite = { version = "0.34", features = ["bundled"] }

# HTTP client (for health checks, future use)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
thiserror = "2"
async-trait = "0.1"

[dev-dependencies]
# Temporary directories for tooling path-resolution tests.
tempfile = "3"
# `tower::util::ServiceExt` used in server.rs tests for `router.oneshot(req)`.
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "debuginfo"

# Fast test builds — skip LTO and use fewer codegen units.
[profile.test]
opt-level = 0
debug = true
