[package]
name = "glassbridge_desktop"
version = "0.1.0"
edition = "2021"
description = "Desktop shell for GlassBridge"
license = "MIT"
publish = false

# Expose a lib target so `cargo test` can reach logic in lib.rs / adb_mock.rs
# without launching the Tauri application.
[lib]
name = "glassbridge_desktop"
path = "src/lib.rs"

[[bin]]
name = "glassbridge_desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri framework
tauri = { version = "2", features = [] }

# HTTP server (embedded Axum replaces Node.js Fastify backend)
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLite registry (replaces node:sqlite DatabaseSync)
rusqlite = { version = "0.34", features = ["bundled"] }

# HTTP client (health checks + agent-bus JSON requests)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
thiserror = "2"
async-trait = "0.1"

# Phase 2: Native ADB protocol (replaces adb.exe process spawning)
adb_client = { version = "3.1", optional = true }

# Phase 3: GPU-accelerated screen mirroring
openh264 = { version = "0.2", optional = true }
wgpu = { version = "24", optional = true }
raw-window-handle = { version = "0.6", optional = true }

# Phase 4: Additional tools
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }

[features]
default = ["native-adb", "screen-mirror"]
native-adb = ["dep:adb_client"]
screen-mirror = ["dep:openh264", "dep:wgpu", "dep:raw-window-handle", "dep:image"]

[dev-dependencies]
# Temporary directories for tooling path-resolution tests.
tempfile = "3"
# `tower::util::ServiceExt` used in server.rs tests for `router.oneshot(req)`.
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "debuginfo"

# Fast test builds — skip LTO and use fewer codegen units.
[profile.test]
opt-level = 0
debug = true
